name: Fix product artwork asset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-product-artwork.yml

permissions:
  contents: write

jobs:
  extract-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract WebP asset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          source = Path("src/components/ProductImage.tsx").read_text(encoding="utf-8")
          match = re.search(r'const SPRITE = "data:image/webp;base64,([A-Za-z0-9+/=]+)";', source)
          if not match:
              raise SystemExit("Inline product sprite was not found")

          encoded = match.group(1).rstrip("=")
          encoded += "=" * (-len(encoded) % 4)
          raw = base64.b64decode(encoded)
          if raw[:4] != b"RIFF" or raw[8:12] != b"WEBP":
              raise SystemExit("Decoded sprite is not a valid WebP container")

          out = Path("public/product-images/catalog.webp")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)
          print(f"Wrote {len(raw)} bytes to {out}")
          PY

      - name: Verify generated asset
        shell: bash
        run: |
          test -s public/product-images/catalog.webp
          file public/product-images/catalog.webp

      - name: Commit asset
        shell: bash
        run: |
          git config user.name "aqilafrds"
          git config user.email "aqilafaradisa22@gmail.com"
          git add public/product-images/catalog.webp
          git commit -m "fix: add product artwork WebP asset"
          git push origin HEAD:main
